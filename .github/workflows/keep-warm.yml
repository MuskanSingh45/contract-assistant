# Keeps the free Render backend awake during review: Render's free tier sleeps after 15 minutes
# without traffic, and the next visitor would wait about a minute. 750 free instance-hours per
# month cover running all day. GitHub may delay scheduled runs by a few minutes.
name: keep-warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the API health endpoint
        run: |
          for attempt in 1 2 3; do
            if curl -fsS --max-time 90 https://contract-assistant-api-4qba.onrender.com/api/health; then
              exit 0
            fi
            echo "attempt $attempt failed; retrying"
            sleep 20
          done
          exit 1
